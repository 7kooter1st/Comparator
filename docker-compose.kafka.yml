services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: comparator-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MESSAGE_MAX_BYTES: 10485760

  postgres:
    image: postgres:16-alpine
    container_name: comparator-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: comparator
      POSTGRES_USER: comparator
      POSTGRES_PASSWORD: comparator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comparator -d comparator"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - comparator-postgres-data:/var/lib/postgresql/data

volumes:
  comparator-postgres-data:
